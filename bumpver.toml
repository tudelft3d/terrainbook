[bumpver]
current_version = "2026.0-beta3"
version_pattern = "YYYY.INC0[-TAGNUM]"
commit = false
tag = false
push = false

[bumpver.file_patterns]
"terrainbook.tex" = [
  'v{version}',
]
"main.typ" = [
  'version: "{version}",',
]
"docs/_config.yml" = [
  "latest_version: {version}",
]
"CITATION.bib" = [
  "year = {YYYY}",
]
"front-back/pre.tex" = [
  " YYYY % VER:YEAR",
]
"front-back/pre.typ" = [
  " YYYY Hugo",
]
